    <meta name="theme-color" content="#1b3022" />

         page's own title, description, canonical link, sharing tags and structured data; in the browser,
         SeoManager keeps them up to date on every navigation. -->
    <!--seo-->
    <title>GreenFarm | Fresh Groceries Delivered in Accra</title>
    <meta data-seo name="description" content="Shop fresh fruit, vegetables, dairy, bakery and pantry staples online. GreenFarm delivers farm-fresh groceries to your door in Accra, Ghana." />
    <meta data-seo property="og:site_name" content="GreenFarm" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:title" content="GreenFarm | Fresh Groceries Delivered in Accra" />
    <meta data-seo name="twitter:card" content="summary_large_image" />
    <!--/seo-->
  </head>
